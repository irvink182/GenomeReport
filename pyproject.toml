[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "genomereport"
version = "1.1.0"
description = "Software for generating automated descriptive reports from genomic surveillance data."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "adjustText",
    "geopandas",
    "matplotlib>=3.8",
    "numpy",
    "openpyxl",
    "pandas>=2.0",
    "shapely",
]

[project.scripts]
genomereport = "genomereport.cli.main:main"

[tool.setuptools.packages.find]
include = ["genomereport*"]

[tool.setuptools.package-data]
genomereport = [
    "rsv_annotations.tsv",
    "data/*.geojson",
    "static/*.css",
    "static/*.js",
    "templates/*.html",
]